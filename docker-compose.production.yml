# What the VPS runs, to be merged into its compose file there. docker-compose.rehearsal.yml runs
# the same services on this machine; keep the two in step.
#
# Format 2.4 because the VPS runs docker-compose v1, and only 2.x keeps depends_on healthcheck
# conditions outside swarm.
#
# Before the first start, on the VPS:
# - the postgres-init folder from the repo, beside this file. The postgres image runs its script
#   only when it sets up an empty volume, to make the app's login role
# - the images folder, owned by the container's app user (uid 1654 in the .NET images):
#     mkdir -p /srv/artist-shop/images && chown 1654:1654 /srv/artist-shop/images
# - two env files beside this file, one per container so neither sees the other's secrets, each
#   readable only by its owner (chmod 600). Compose v1 doesn't substitute variables inside an env
#   file, so the password is written out in each line.
#   .artist-shop-postgres-env:
#     POSTGRES_PASSWORD=<superuser password, never given to the app>
#     POSTGRES_APP_PASSWORD=<app password>
#   .artist-shop-web-env:
#     ConnectionStrings__ArtistShopPlatform=Host=artist-shop-postgres;Database=artist_shop_platform;Username=artist_shop_app;Password=<app password>
#     ConnectionStrings__ArtistShopIdentity=Host=artist-shop-postgres;Database=artist_shop_identity;Username=artist_shop_app;Password=<app password>
#     FirstSite__OwnerEmail=<email>
#     FirstSite__OwnerPassword=<password>
#   The first boot makes the first site, owned by that account (made with that password if it
#   doesn't exist). Both lines are read only while there are no sites, so they can go after it.
#
# Memory is sized from the VPS measured on 2026-09-21: 1971 MB total, one CPU, 2 GB of swap, and
# about 485 MB available once the old pm2 apps were stopped.

version: "2.4"

services:
    artist-shop-web:
        image: snowd3n/artist-shop
        restart: unless-stopped
        env_file:
            - .artist-shop-web-env
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            # The platform's own host, where artists sign up; each site has a subdomain of it. A
            # request for a host that's neither the platform's nor a site's gets a 404
            # (UseKnownHosts), so a forged Host header can't end up in the absolute addresses the
            # app builds from it (link previews, and password-reset links once email exists)
            - Platform__Host=artshop.mikesilverman.net
            # The first site's hosts, used only while the platform database has no sites, until
            # sign-up replaces it (multi-tenancy step 5c in todo.md). Needs the wildcard DNS record
            - FirstSite__Hosts__0=site1.artshop.mikesilverman.net
            # the app is only reachable through nginx, which sends X-Forwarded-Proto and
            # X-Forwarded-For. This makes the app trust them, so it sees https and the visitor's
            # address
            - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
            # How much of mem_limit .NET may put on its own heap. It has to be larger than the image
            # budget below or the app refuses to start. Read as hexadecimal: 0x2D is 45, so 45% of
            # 768 MB is 345 MB
            - DOTNET_GCHeapHardLimitPercent=0x2D
            # libvips allocates outside the .NET heap. A 48 MP photo (8000 x 6000) estimates at
            # 275 MB; a larger one is refused with a message
            - ImageProcessing__MemoryBudgetMegabytes=300
            - ImageProcessing__MaximumMegapixels=48
            # measured on the VPS: a 48 MP image takes about 19 seconds on its one CPU. The app
            # lets ProxyTimeout / EstimatedTimePerImage uploads wait (4 here) and tells the rest
            # it's busy, so nothing waits past nginx's proxy_read_timeout, which must match
            # ProxyTimeout
            - ImageProcessing__EstimatedTimePerImage=00:00:25
            - ImageProcessing__ProxyTimeout=00:02:00
        ports:
            # loopback only: nginx on the host reaches it, the internet doesn't
            - 127.0.0.1:8089:8080
        # measured in the rehearsal: a run of 48 MP uploads peaked at 612 MB, of which about 310 MB
        # was the app's own and the rest file cache the kernel gives back when asked
        mem_limit: 768m
        # Docker keeps every line a container logs unless told otherwise; three 10 MB files at most
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: "3"
        volumes:
            # a host folder rather than a volume, so the images can be backed up and rsynced like
            # any other files. The app writes to /data/images (set in the Dockerfile)
            - /srv/artist-shop/images:/data/images
            # the keys that sign login cookies; without a volume every redeploy logs everyone out
            - artist_shop_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
        depends_on:
            artist-shop-postgres:
                condition: service_healthy

    artist-shop-postgres:
        image: postgres:18
        restart: unless-stopped
        # half the default shared memory cache: the whole catalog is a few megabytes
        command: ["postgres", "-c", "shared_buffers=64MB"]
        env_file:
            - .artist-shop-postgres-env
        # not published: only the app talks to it, over the compose network
        mem_limit: 256m
        volumes:
            # postgres:18 keeps its data in a versioned folder under this one, so a later major
            # version upgrade can sit beside the old data
            - artist_shop_pg_volume:/var/lib/postgresql
            - ./postgres-init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            # over TCP: while a new volume initialises, a temporary server answers only on the
            # local socket, and a socket check would call that healthy
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    artist_shop_pg_volume:
    artist_shop_data_protection_keys:
