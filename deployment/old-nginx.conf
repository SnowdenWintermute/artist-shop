server {
  server_name artshop.mikesilverman.net;

  client_max_body_size 26m;

  location / {
    proxy_pass http://127.0.0.1:8089;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # an upload can queue behind others for up to ImageProcessing__ProxyTimeout in
    # docker-compose.production.yml; the two must match
    proxy_read_timeout 120s;
  }

  location /_blazor {
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/artshop.mikesilverman.net/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/artshop.mikesilverman.net/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
  if ($host = artshop.mikesilverman.net) {
    return 301 https://$host$request_uri;
  } # managed by Certbot


  server_name artshop.mikesilverman.net;

  listen 80;
  return 404; # managed by Certbot
}
