services:
  artist-shop-postgres:
    image: postgres:18
    container_name: artist-shop-postgres
    environment:
      # compose reads POSTGRES_PASSWORD from .env for this substitution
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # 5432 and 5433 on this machine belong to speed-dungeon's and snowauth's Postgres
      - 5434:5432
    volumes:
      # The postgres:18 image keeps its data in a versioned folder under /var/lib/postgresql, and
      # mounting the parent is what lets a later major-version upgrade sit alongside the old data
      - artist-shop-postgres_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 asks over TCP on purpose: while the image initialises a new volume it runs a
      # temporary server that only answers on the local socket, and a socket check would call
      # that healthy
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  artist-shop-postgres_data:
