services:
  artist-shop-mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: artist-shop-mssql
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
    ports:
      - 1433:1433
    volumes:
      # Named volume, not a bind mount: the image runs as uid 10001 and cannot write to a
      # host directory owned by us.
      - artist-shop-mssql_data:/var/opt/mssql
    healthcheck:
      # sqlcmd is in the image but not on PATH. -C trusts the self-signed cert the container
      # generates for itself. The port opens well before the engine answers queries, so this
      # is what dev.sh waits on rather than the port.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  artist-shop-mssql_data:
