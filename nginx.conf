# artshop.mikesilverman.net and every site's subdomain of it: the VPS's nginx server block, which
# proxies to 127.0.0.1:8089 (see docker-compose.production.yml). Copy to
# /etc/nginx/sites-available/artshop, linked into sites-enabled.
#
# One wildcard certificate covers both names. Let's Encrypt issues a wildcard only over a DNS
# challenge, which certbot answers through acme-dns: _acme-challenge.artshop.mikesilverman.net is a
# CNAME at Namecheap to the acme-dns account, so certbot never needs Namecheap's API. Its renewal
# timer reloads nginx afterwards (--deploy-hook); the steps are in todo.md.

server {
  server_name artshop.mikesilverman.net *.artshop.mikesilverman.net;

  # an image upload is at most 25 MiB plus the form around it
  # (ImageUploadValidation.MaximumRequestBytes); nginx's default is 1 MB
  client_max_body_size 26m;

  # 127.0.0.1, not localhost: localhost also means the IPv6 ::1, where docker doesn't publish
  # the port, and nginx treats the two as a pair of servers. Each refusal from ::1 marks it
  # down, and once 127.0.0.1 also fails a request, nginx refuses everything for 10 seconds
  # ("no live upstreams"). With one address it never marks the server down
  location / {
    proxy_pass http://127.0.0.1:8089;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # an upload can queue behind others for up to ImageProcessing__ProxyTimeout in
    # docker-compose.production.yml; the two must match
    proxy_read_timeout 120s;
  }

  # the websocket the interactive islands talk over. Its own block because only a websocket
  # should be sent Connection: upgrade; the timeouts keep an idle circuit's socket open
  location /_blazor {
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/artshop-wildcard/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/artshop-wildcard/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name artshop.mikesilverman.net *.artshop.mikesilverman.net;

  listen 80;
  return 301 https://$host$request_uri;
}
